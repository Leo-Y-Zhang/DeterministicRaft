[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raftverified"
version = "1.2.0"
description = "Educational Raft consensus implementation verified by deterministic simulation testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Leo-Y-Zhang" }]
keywords = ["raft", "consensus", "distributed-systems", "deterministic-simulation", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
raftverified = "raftverified.cli:main"

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools]
packages = ["raftverified"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: long invariant sweeps, excluded from the default run (use -m slow)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
